services:
  fuzz:
    image: nats-aflnet-bench:2.15.3
    build:
      context: .
      args:
        NATS_IMAGE: ${NATS_IMAGE:?set NATS_IMAGE in images.env}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:?set DEBIAN_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 1500m
    memswap_limit: 1500m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/nats-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
