services:
  fuzz:
    image: pynetdicom-aflnet-bench:3.0.4
    build:
      context: .
      args:
        PYNETDICOM_IMAGE: ${PYNETDICOM_IMAGE:?set PYNETDICOM_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 1200m
    memswap_limit: 1200m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/pynetdicom-fuzz-30m-20261112", "30m"]

networks:
  isolated:
    internal: true
