services:
  fuzz:
    image: ${OPENSSL_QUIC_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: docker.io/library/ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    network_mode: none
    volumes:
      - ./results:/results
      - ./seeds:/opt/benchmark/seeds
    cpus: 2.0
    mem_limit: 1g
    init: false
