services:
  fuzz:
    image: openssl-dtls-aflnet-bench:4.1.0
    build:
      context: .
      args:
        DTLS_BASE_IMAGE: ${DTLS_BASE_IMAGE:?set DTLS_BASE_IMAGE in images.env}
        OPENSSL_VERSION: ${OPENSSL_VERSION:?set OPENSSL_VERSION in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/openssl-dtls-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
