services:
  fuzz:
    image: powerdns-recursor-aflnet-bench:5.4.9
    build:
      context: .
      args:
        PDNS_BASE_IMAGE: ${PDNS_BASE_IMAGE:?set PDNS_BASE_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
        PDNS_PACKAGE_VERSION: ${PDNS_PACKAGE_VERSION:?set PDNS_PACKAGE_VERSION in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/pdns-recursor-fuzz-30m-20261112", "30m"]

networks:
  isolated:
    internal: true
