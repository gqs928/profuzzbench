incoming:
  listen:
    - 0.0.0.0
  port: 5300
  allow_from:
    - 0.0.0.0/0
  max_tcp_clients: 64
recursor:
  daemon: false
  threads: 1
  setuid: pdns
  setgid: pdns
  socket_dir: /run/pdns-benchmark
  auth_zones:
    - zone: fuzz.test
      file: /opt/benchmark/fuzz.test.zone
logging:
  loglevel: 4
