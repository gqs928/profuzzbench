listen=YES
listen_ipv6=NO
listen_address=127.0.0.1
listen_port=2121
background=NO

anonymous_enable=YES
no_anon_password=YES
local_enable=NO
run_as_launching_user=YES
ftp_username=ftp
anon_root=/srv/ftp
secure_chroot_dir=/usr/share/empty

write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO
download_enable=NO
dirlist_enable=NO
pasv_enable=NO
port_enable=NO

ftpd_banner=vsftpd 3.0.5 benchmark
hide_ids=YES
log_ftp_protocol=NO
xferlog_enable=NO
seccomp_sandbox=NO
idle_session_timeout=8
data_connection_timeout=2
connect_timeout=2
accept_timeout=2
