node {
  name = "emqx@127.0.0.1"
  cookie = "emqx-baseline-local-cookie"
}

log.console.level = warning
log.file {
  enable = false
}

listeners.tcp.default {
  bind = "127.0.0.1:1883"
  enable = true
  enable_authn = false
  max_connections = 256
}

listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
listeners.quic.default.enable = false

dashboard.listeners.http.bind = 0
dashboard.listeners.https.bind = 0

authorization.no_match = allow
authorization.deny_action = ignore
authorization.cache.enable = false

cluster.discovery_strategy = manual
