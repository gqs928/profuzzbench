; 固定拨号计划用于让 SIP 请求进入 Asterisk 的业务处理路径。
[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]

[fuzz]
exten => 100,1,NoOp(模糊测试 INVITE 进入拨号计划)
 same => n,Wait(5)
 same => n,Answer()
 same => n,Hangup()
exten => 101,1,NoOp(模糊测试忙线业务路径)
 same => n,Busy(1)
 same => n,Hangup()
exten => _X!,1,Hangup()
