; 本配置只把 PJSIP/TCP 绑定到容器回环地址。
[global]
type=global
endpoint_identifier_order=ip,username
user_agent=Asterisk-SIP-Fuzz-Benchmark

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5060

; 本地无认证端点仅用于协议回放，禁止将此配置用于生产环境。
[alice]
type=endpoint
transport=transport-tcp
context=fuzz
disallow=all
allow=ulaw
aors=alice
identify_by=ip,username
direct_media=no
allow_subscribe=yes

[alice]
type=aor
max_contacts=10
remove_existing=yes

[benchmark-identify]
type=identify
endpoint=alice
match=127.0.0.1
