services:
  fuzz:
    image: zookeeper-aflnet-bench:3.9.7
    build:
      context: .
      args:
        ZOOKEEPER_IMAGE: ${ZOOKEEPER_IMAGE:?set ZOOKEEPER_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 2300m
    memswap_limit: 2300m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/zookeeper-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true

