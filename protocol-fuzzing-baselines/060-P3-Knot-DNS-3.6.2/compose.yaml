services:
  fuzz:
    image: knot-dns-aflnet-bench:3.6.2
    build:
      context: .
      args:
        KNOT_BASE_IMAGE: ${KNOT_BASE_IMAGE:?set KNOT_BASE_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/knot-dns-fuzz-30m-20261112", "30m"]

networks:
  isolated:
    internal: true
