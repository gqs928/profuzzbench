services:
  fuzz:
    image: scylla-native-fuzz-bench:2026.3.5
    build:
      context: .
      args:
        SCYLLA_IMAGE: ${SCYLLA_IMAGE:?set SCYLLA_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 3200m
    memswap_limit: 3200m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    network_mode: none
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/scylla-fuzz-30m", "30m"]
