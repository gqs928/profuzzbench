options {
    directory "/work/state";
    listen-on port 5353 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    pid-file "/work/state/named.pid";
    session-keyfile "/work/state/session.key";
    managed-keys-directory "/work/state";
    empty-zones-enable no;
};

zone "example.test" IN {
    type primary;
    file "/work/zone.example";
    allow-update { none; };
    allow-transfer { none; };
};
