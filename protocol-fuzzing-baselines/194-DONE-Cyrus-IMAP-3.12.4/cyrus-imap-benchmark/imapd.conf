admins: cyrusfuzz

configdirectory: /tmp/cyrus-benchmark-state/config
proc_path: /tmp/cyrus-benchmark-state/proc
mboxname_lockpath: /tmp/cyrus-benchmark-state/lock
duplicate_db_path: /tmp/cyrus-benchmark-state/duplicate.db
ptscache_db_path: /tmp/cyrus-benchmark-state/ptscache.db
statuscache_db_path: /tmp/cyrus-benchmark-state/statuscache.db
tls_sessions_db_path: /tmp/cyrus-benchmark-state/tls_sessions.db

defaultpartition: default
partition-default: /tmp/cyrus-benchmark-state/mail
sievedir: /tmp/cyrus-benchmark-state/sieve

virtdomains: no
defaultdomain: localhost
allowplaintext: yes
sasl_pwcheck_method: saslauthd
sasl_saslauthd_path: /tmp/cyrus-benchmark-state/saslauthd/mux
sasl_mech_list: PLAIN LOGIN

syslog_prefix: cyrus-benchmark
