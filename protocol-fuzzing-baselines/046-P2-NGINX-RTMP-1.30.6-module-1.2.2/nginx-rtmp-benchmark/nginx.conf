worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:8080;
        location / {
            return 200 "nginx-rtmp-benchmark\n";
        }
    }
}

rtmp {
    server {
        listen 127.0.0.1:1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }
    }
}
