hosts:
  - localhost

loglevel: warning
auth_method: internal
default_db: mnesia
certfiles:
  - /opt/benchmark/tls/server.pem

listen:
  -
    port: 5222
    ip: "127.0.0.1"
    module: ejabberd_c2s
    max_stanza_size: 65536
    shaper: c2s_shaper
    access: c2s
    starttls: true
    starttls_required: false

acl:
  loopback:
    ip:
      - 127.0.0.1/32

access_rules:
  c2s:
    allow: all
  local:
    allow: loopback

shaper:
  normal:
    rate: 100000
    burst_size: 100000
  fast: 100000

shaper_rules:
  c2s_shaper:
    fast: all

modules:
  mod_disco: {}
  mod_ping: {}
  mod_version: {}
