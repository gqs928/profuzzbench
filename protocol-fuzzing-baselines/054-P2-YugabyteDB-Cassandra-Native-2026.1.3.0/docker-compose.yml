services:
  fuzz:
    image: yugabyte-native-fuzz-bench:2026.1.3.0
    build:
      context: .
      args:
        YUGABYTE_IMAGE: ${YUGABYTE_IMAGE:?set YUGABYTE_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 4300m
    memswap_limit: 4300m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/yugabyte-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
