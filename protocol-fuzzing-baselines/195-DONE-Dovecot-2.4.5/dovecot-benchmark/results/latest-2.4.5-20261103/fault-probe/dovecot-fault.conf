dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

listen = 127.0.0.1
base_dir = /tmp/dovecot-benchmark-state/run
state_dir = /tmp/dovecot-benchmark-state/state
log_path = /tmp/dovecot-benchmark-state/log/dovecot.log
info_log_path = /tmp/dovecot-benchmark-state/log/info.log
instance_name = dovecot-imap-benchmark
default_internal_user = ubuntu
default_login_user = ubuntu

protocols {
  imap = yes
}

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /tmp/dovecot-benchmark-state/mail/home/%{user}

auth_mechanisms = plain login
auth_allow_cleartext = yes
auth_verbose = yes
ssl = no

passdb passwd-file {
  passwd_file_path = /results/fault-probe/passwd-fault
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = ubuntu
    gid = ubuntu
    home = /tmp/dovecot-benchmark-state/mail/home/%{user}
  }
}

service imap-login {
  chroot = /
  user = ubuntu
  inet_listener imap {
    listen = 127.0.0.1
    port = 1143
  }
}

service imap {
  user = ubuntu
}

service auth {
  user = ubuntu
}
