services:
  fuzz:
    image: gnutls-dtls-aflnet-bench:3.8.13
    build:
      context: .
      args:
        DTLS_BASE_IMAGE: ${DTLS_BASE_IMAGE:?set DTLS_BASE_IMAGE in images.env}
        GNUTLS_VERSION: ${GNUTLS_VERSION:?set GNUTLS_VERSION in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/gnutls-dtls-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
