services:
  fuzz:
    image: frr-bgp-aflnet-bench:10.7.1
    build:
      context: .
      args:
        FRR_IMAGE: ${FRR_IMAGE:?set FRR_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 1200m
    memswap_limit: 1200m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/frr-bgp-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
