hostname frr-bgp-benchmark
!
router bgp 65000
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor FUZZ peer-group
 neighbor FUZZ remote-as external
 bgp listen range 127.0.0.0/8 peer-group FUZZ
 address-family ipv4 unicast
  neighbor FUZZ activate
 exit-address-family
!
