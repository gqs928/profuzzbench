services:
  fuzz:
    image: mongodb-server-aflnet-bench:9.0.8
    build:
      context: .
      args:
        MONGO_IMAGE: ${MONGO_IMAGE:?set MONGO_IMAGE in images.env}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./results:/results
    tmpfs:
      - /tmp/mongodb-aflnet:rw,nosuid,nodev,noexec,size=512m,mode=1777
    network_mode: none
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    init: true
    restart: "no"
    command: ["/opt/benchmark/run.sh", "/results/fuzz-30m", "30m"]
