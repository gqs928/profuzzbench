  local-data: "fuzz.test. 60 IN SOA ns.fuzz.test. hostmaster.fuzz.test. 2026111201 60 60 3600 60"
  local-data: "fuzz.test. 60 IN NS ns.fuzz.test."
  local-data: "ns.fuzz.test. 60 IN A 192.0.2.53"
  local-data: "www.fuzz.test. 60 IN A 192.0.2.80"
  local-data: "www.fuzz.test. 60 IN AAAA 2001:db8::80"
  local-data: "mail.fuzz.test. 60 IN MX 10 mail.fuzz.test."
  local-data: "mail.fuzz.test. 60 IN A 192.0.2.25"
  local-data: "text.fuzz.test. 60 IN TXT \"fuzz dns tcp resolver zone\""
