services:
  fuzz:
    image: unbound-dns-aflnet-bench:1.26.2
    build:
      context: .
      args:
        UNBOUND_BASE_IMAGE: ${UNBOUND_BASE_IMAGE:?set UNBOUND_BASE_IMAGE in images.env}
        UNBOUND_VERSION: ${UNBOUND_VERSION:?set UNBOUND_VERSION in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/unbound-fuzz-30m-20261112", "30m"]

networks:
  isolated:
    internal: true
