services:
  fuzz:
    image: cassandra-native-fuzz-bench:5.0.9
    build:
      context: .
      args:
        CASSANDRA_IMAGE: ${CASSANDRA_IMAGE:?set CASSANDRA_IMAGE in images.env}
    volumes:
      - ./results:/results
    tmpfs:
      - /var/lib/cassandra:rw,nosuid,nodev,size=1536m,mode=1777
    cpus: 2
    mem_limit: 2048m
    memswap_limit: 2048m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks: [isolated]
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/cassandra-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
