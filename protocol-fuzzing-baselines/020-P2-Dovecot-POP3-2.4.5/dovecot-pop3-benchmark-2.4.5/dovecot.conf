dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

listen = 127.0.0.1
base_dir = /tmp/dovecot-pop3-benchmark-state/run
state_dir = /tmp/dovecot-pop3-benchmark-state/state
log_path = /tmp/dovecot-pop3-benchmark-state/log/dovecot.log
info_log_path = /tmp/dovecot-pop3-benchmark-state/log/info.log
instance_name = dovecot-pop3-benchmark
default_internal_user = ubuntu
default_login_user = ubuntu

protocols {
  pop3 = yes
}

mail_driver = maildir
mail_path = ~/Maildir
mail_home = /tmp/dovecot-pop3-benchmark-state/mail/home/%{user}

auth_mechanisms = plain login
auth_allow_cleartext = yes
auth_verbose = yes
ssl = no

passdb passwd-file {
  passwd_file_path = /workspace/passwd
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = ubuntu
    gid = ubuntu
    home = /tmp/dovecot-pop3-benchmark-state/mail/home/%{user}
  }
}

service pop3-login {
  user = ubuntu
  inet_listener pop3 {
    listen = 127.0.0.1
    port = 1110
  }
}

service pop3 {
  user = ubuntu
}

service auth {
  user = ubuntu
}
