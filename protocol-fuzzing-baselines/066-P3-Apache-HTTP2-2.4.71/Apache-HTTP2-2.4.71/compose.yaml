services:
  fuzz:
    image: ${HTTPD_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTPD_BASE_IMAGE: docker.io/library/ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    network_mode: none
    volumes:
      - ./results:/results
      - ./replay_queue.py:/opt/benchmark/replay_queue.py:ro
    cpus: 2.0
    mem_limit: 1g
    init: false
