services:
  fuzz:
    image: dcm4che-aflnet-bench:5.35.2
    build:
      context: .
      args:
        DCM4CHE_IMAGE: ${DCM4CHE_IMAGE:?set DCM4CHE_IMAGE in images.env}
        AFL_BUILDER_IMAGE: ${AFL_BUILDER_IMAGE:?set AFL_BUILDER_IMAGE in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 1200m
    memswap_limit: 1200m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/dcm4che-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
