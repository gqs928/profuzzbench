services:
  documentdb:
    image: ${DOCUMENTDB_IMAGE:?set DOCUMENTDB_IMAGE in images.env}
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=768m,mode=700
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [isolated]
    restart: "no"

  fuzz:
    image: ferretdb-mongodb-fuzz-bench:2.7.0
    build:
      context: .
      args:
        FERRETDB_IMAGE: ${FERRETDB_IMAGE:?set FERRETDB_IMAGE in images.env}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:?set DEBIAN_IMAGE in images.env}
    depends_on:
      documentdb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: documentdb
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    volumes:
      - ./results:/results
    cpus: 1
    mem_limit: 1280m
    memswap_limit: 1280m
    networks: [isolated]
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
