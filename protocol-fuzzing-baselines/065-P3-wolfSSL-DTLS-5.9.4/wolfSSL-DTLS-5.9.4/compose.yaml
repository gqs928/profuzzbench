services:
  fuzz:
    image: wolfssl-dtls-aflnet-bench:5.9.4
    build:
      context: .
      args:
        DTLS_BASE_IMAGE: ${DTLS_BASE_IMAGE:?set DTLS_BASE_IMAGE in images.env}
        WOLFSSL_VERSION: ${WOLFSSL_VERSION:?set WOLFSSL_VERSION in images.env}
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 768m
    memswap_limit: 768m
    networks:
      - isolated
    restart: "no"
    command: ["bash", "/opt/benchmark/run.sh", "/results/wolfssl-dtls-fuzz-30m", "30m"]

networks:
  isolated:
    internal: true
