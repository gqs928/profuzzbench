{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["lo/127.0.0.1"],
      "dhcp-socket-type": "udp"
    },
    "lease-database": {
      "type": "memfile",
      "persist": false,
      "name": "/tmp/kea-leases4.csv"
    },
    "multi-threading": {
      "enable-multi-threading": false
    },
    "valid-lifetime": 600,
    "renew-timer": 300,
    "rebind-timer": 500,
    "subnet4": [
      {
        "id": 1,
        "subnet": "127.0.0.0/8",
        "pools": [
          {"pool": "127.0.0.100-127.0.0.150"}
        ],
        "option-data": [
          {"name": "domain-name-servers", "data": "127.0.0.1"}
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "severity": "INFO",
        "output_options": [{"output": "stdout"}]
      }
    ]
  }
}
