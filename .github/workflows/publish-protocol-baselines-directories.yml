name: Publish browsable protocol benchmark directories

on:
  push:
    branches:
      - 'codex/protocol-baselines-directories-2026-11-14'
    paths:
      - '.github/workflows/publish-protocol-baselines-directories.yml'

permissions:
  contents: write

jobs:
  expand-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: false
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify and expand the published package assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: protocol-fuzzing-baselines-2026-11-14
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import os
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          OWNER = "gqs928"
          REPO = "profuzzbench"
          RELEASE_TAG = os.environ["RELEASE_TAG"]
          BRANCH = os.environ["PUBLISH_BRANCH"]
          ROOT = Path("protocol-fuzzing-baselines")
          WORKFLOW = ".github/workflows/publish-protocol-baselines-directories.yml"
          SPLIT_PACKAGE = "007-P2-EMQX-MQTT-6.3.2"
          SPLIT_FILE = "emqx-benchmark/results/build/emqx-6.3.2-ubuntu24.04-amd64.tar.gz"
          SPLIT_CHUNK_BYTES = 90 * 1024 * 1024
          EXPECTED_RANKS = [r for r in range(1, 80) if r != 5] + list(range(191, 203))
          EXPECTED_FILES = 92097
          EXPECTED_BYTES = 5165295356
          MAX_PACKAGE_BYTES = 600_000_000
          MAX_TOTAL_BYTES = 6_000_000_000
          SUPPORT = {
              "998-benchmarking-experience-library.md",
              "998-original-README.md",
              "998-version-checklist.md",
              "999-coverage-matrix-recommended-order.xlsx",
              "999-MANIFEST.csv",
              "999-readme-sheet-order.md",
              "999-SHA256SUMS.txt",
          }

          def run_git(args):
              subprocess.run(["git", *args], check=True)

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "protocol-baseline-directory-publisher",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return __import__("json").load(response)

          def download_asset(asset, target):
              url = asset["browser_download_url"]
              if urllib.parse.urlparse(url).hostname != "github.com":
                  raise RuntimeError(f"Unexpected asset host: {url}")
              req = urllib.request.Request(url, headers={"User-Agent": "protocol-baseline-directory-publisher"})
              h = hashlib.sha256()
              size = 0
              with urllib.request.urlopen(req, timeout=180) as response, target.open("wb") as out:
                  while True:
                      block = response.read(8 * 1024 * 1024)
                      if not block:
                          break
                      out.write(block)
                      h.update(block)
                      size += len(block)
              if size != asset["size"]:
                  raise RuntimeError(f"Size mismatch for {asset['name']}: {size} != {asset['size']}")
              expected = (asset.get("digest") or "").removeprefix("sha256:")
              if expected and h.hexdigest() != expected:
                  raise RuntimeError(f"SHA-256 mismatch for {asset['name']}")
              return h.hexdigest(), size

          def extract_package(zip_path, destination):
              destination.mkdir(parents=True, exist_ok=True)
              seen = set()
              file_bytes = 0
              file_count = 0
              skipped_git_bytes = 0
              skipped_git_files = 0
              with zipfile.ZipFile(zip_path) as archive:
                  entries = archive.infolist()
                  for info in entries:
                      raw = info.filename
                      if "\\" in raw or chr(0) in raw or raw.startswith("/"):
                          raise RuntimeError(f"Unsafe ZIP path: {raw!r}")
                      parts = PurePosixPath(raw).parts
                      if not parts or any(part == ".." for part in parts) or parts[0].endswith(":"):
                          raise RuntimeError(f"Unsafe ZIP path: {raw!r}")
                      if ".git" in parts:
                          if not info.is_dir():
                              skipped_git_bytes += info.file_size
                              skipped_git_files += 1
                          continue
                      kind = stat.S_IFMT(info.external_attr >> 16)
                      if kind == stat.S_IFLNK:
                          raise RuntimeError(f"Symlink not permitted in package tree: {raw!r}")
                      relative = PurePosixPath(*parts)
                      normalized = relative.as_posix().rstrip("/")
                      if normalized in seen:
                          raise RuntimeError(f"Duplicate ZIP path: {raw!r}")
                      seen.add(normalized)
                      file_bytes += 0 if info.is_dir() else info.file_size
                      if not info.is_dir():
                          file_count += 2 if destination.name == SPLIT_PACKAGE and relative.as_posix() == SPLIT_FILE else 1
                  if file_bytes > MAX_TOTAL_BYTES:
                      raise RuntimeError(f"Package exceeds extraction bound: {zip_path.name}")
                  for info in entries:
                      parts = PurePosixPath(info.filename).parts
                      if ".git" in parts:
                          continue
                      relative = PurePosixPath(*parts)
                      target = destination.joinpath(*relative.parts)
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          os.chmod(target, 0o755)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if destination.name == SPLIT_PACKAGE and relative.as_posix() == SPLIT_FILE:
                          digest = hashlib.sha256()
                          remaining = info.file_size
                          part_names = []
                          part_number = 1
                          with archive.open(info) as source:
                              while remaining:
                                  part = target.with_name(target.name + f".part-{part_number:03d}")
                                  amount = min(SPLIT_CHUNK_BYTES, remaining)
                                  left = amount
                                  with part.open("wb") as output:
                                      while left:
                                          block = source.read(min(8 * 1024 * 1024, left))
                                          if not block:
                                              raise RuntimeError(f"Truncated large file: {raw!r}")
                                          output.write(block)
                                          digest.update(block)
                                          left -= len(block)
                                  os.chmod(part, 0o644)
                                  part_names.append(part.name)
                                  remaining -= amount
                                  part_number += 1
                          if len(part_names) != 2:
                              raise RuntimeError(f"Expected two parts for large file, got {len(part_names)}")
                          marker = target.with_name("EMQX-LARGE-FILE-RESTORE.md")
                          marker_text = "\n".join([
                              "# Restore the large EMQX build artifact",
                              "",
                              f"Original path: {SPLIT_FILE}",
                              f"Original size: {info.file_size} bytes",
                              f"Original SHA-256: {digest.hexdigest()}",
                              "",
                              "The file exceeded GitHub's regular Git file-size limit, so its exact bytes are split into two adjacent files:",
                              "",
                              *[f"- {name}" for name in part_names],
                              "",
                              "After downloading both part files, restore and verify it with:",
                              "",
                              "    cat " + " ".join(part_names) + " > " + target.name,
                              "    echo '" + digest.hexdigest() + "  " + target.name + "' | sha256sum -c -",
                              "",
                          ]) + "\n"
                          marker.write_text(marker_text, encoding="utf-8")
                          continue
                      with archive.open(info) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output, 8 * 1024 * 1024)
                      mode = (info.external_attr >> 16) & 0o777
                      os.chmod(target, 0o755 if mode & 0o111 else 0o644)
              return file_count, file_bytes, skipped_git_files, skipped_git_bytes

          release_url = f"https://api.github.com/repos/{OWNER}/{REPO}/releases/tags/{RELEASE_TAG}"
          release = request_json(release_url)
          assets = release.get("assets", [])
          package_assets = []
          for asset in assets:
              if not asset["name"].lower().endswith(".zip"):
                  continue
              match = re.match(r"^(\d{3})-[A-Za-z0-9_.-]+\.zip$", asset["name"])
              if not match:
                  raise RuntimeError(f"Unexpected package name: {asset['name']}")
              package_assets.append((int(match.group(1)), asset))
          package_assets.sort(key=lambda item: item[0])
          ranks = [rank for rank, _ in package_assets]
          if ranks != EXPECTED_RANKS:
              raise RuntimeError(f"Rank mismatch: got {ranks}")
          support_assets = {a["name"]: a for a in assets if a["name"] in SUPPORT}
          if set(support_assets) != SUPPORT:
              raise RuntimeError(f"Missing support assets: {sorted(SUPPORT - set(support_assets))}")

          ROOT.mkdir(parents=True, exist_ok=True)
          readme = [
              "# Protocol fuzzing benchmark directories",
              "",
              "The package contents below are expanded into ordinary folders so they can be browsed file by file on GitHub. Folder prefixes follow the order on sheet 4, “基准化推荐顺序”, of the supplied coverage matrix.",
              "",
              "This publication contains recommendation ranks 1–79 except rank 5 (Kamailio was absent from the source archive), plus completed ranks 191–202. Ranks 80–190 were absent from the source archive.",
              "",
              "The package ZIP files themselves are not copied into this directory tree. Each folder keeps the internal path layout and executable bits from its source package. Embedded .git metadata directories are omitted; they contain version-control internals rather than benchmark working files.",
              "",
              "The 118.6 MB EMQX build tarball exceeds GitHub’s 100 MiB regular-file limit, so it is stored as two adjacent part files with a SHA-256 reconstruction note in the EMQX directory.",
              "",
              "The source workbook, package checksums, original notes, and the expanded extraction manifest are in [the _metadata folder](./_metadata/).",
              "",
              "| Order | Browse directory |",
              "|---:|---|",
          ]
          for rank, asset in package_assets:
              folder = asset["name"][:-4]
              readme.append(f"| {rank} | [{folder}/](./{folder}/) |")
          (ROOT / "README.md").write_text("\n".join(readme) + "\n", encoding="utf-8")

          rows = []
          total_files = 0
          total_bytes = 0
          skipped_git_files = 0
          skipped_git_bytes = 0
          batch = []
          batch_bytes = 0
          pushes = 0

          def flush_batch():
              global batch, batch_bytes, pushes
              if not batch:
                  return
              paths = ["protocol-fuzzing-baselines/README.md", *batch]
              run_git(["add", "-f", "--", *paths])
              changed = subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0
              if changed:
                  first = batch[0].split("/", 1)[1][:3]
                  last = batch[-1].split("/", 1)[1][:3]
                  run_git(["commit", "-m", f"Add ordered protocol baseline directories {first}-{last}"])
                  if pushes:
                      time.sleep(11)
                  run_git(["push", "origin", f"HEAD:refs/heads/{BRANCH}"])
                  pushes += 1
              batch = []
              batch_bytes = 0

          with tempfile.TemporaryDirectory(prefix="protocol-baselines-") as temp:
              temp_dir = Path(temp)
              grand_total = 0
              for rank, asset in package_assets:
                  zip_path = temp_dir / asset["name"]
                  digest, zip_bytes = download_asset(asset, zip_path)
                  folder = asset["name"][:-4]
                  destination = ROOT / folder
                  if destination.exists():
                      if not destination.is_dir():
                          raise RuntimeError(f"Existing package path is not a directory: {destination}")
                      with zipfile.ZipFile(zip_path) as archive:
                          package_files = sum(
                              1 for info in archive.infolist()
                              if not info.is_dir() and ".git" not in PurePosixPath(info.filename).parts
                          ) + (1 if destination.name == SPLIT_PACKAGE else 0)
                          package_bytes = sum(
                              info.file_size for info in archive.infolist()
                              if not info.is_dir() and ".git" not in PurePosixPath(info.filename).parts
                          )
                          git_files = sum(
                              1 for info in archive.infolist()
                              if not info.is_dir() and ".git" in PurePosixPath(info.filename).parts
                          )
                          git_bytes = sum(
                              info.file_size for info in archive.infolist()
                              if not info.is_dir() and ".git" in PurePosixPath(info.filename).parts
                          )
                  else:
                      package_files, package_bytes, git_files, git_bytes = extract_package(zip_path, destination)
                  zip_path.unlink()
                  rows.append((rank, folder, asset["name"], zip_bytes, digest, package_files, package_bytes, git_files, git_bytes))
                  total_files += package_files
                  total_bytes += package_bytes
                  skipped_git_files += git_files
                  skipped_git_bytes += git_bytes
                  grand_total += package_bytes
                  if grand_total > MAX_TOTAL_BYTES:
                      raise RuntimeError("Combined extracted content exceeded 6 GB bound")
                  batch.append(str(destination))
                  batch_bytes += package_bytes
                  if batch_bytes >= MAX_PACKAGE_BYTES:
                      flush_batch()
                  print(f"Prepared {rank:03d} {folder}: {package_files} files, {package_bytes} bytes")

              if total_files != EXPECTED_FILES or total_bytes != EXPECTED_BYTES:
                  raise RuntimeError(
                      f"Expanded content totals differ: files={total_files}, bytes={total_bytes}; "
                      f"expected files={EXPECTED_FILES}, bytes={EXPECTED_BYTES}"
                  )
              flush_batch()

              metadata_dir = ROOT / "_metadata"
              metadata_dir.mkdir(parents=True, exist_ok=True)
              for name, asset in sorted(support_assets.items()):
                  dest = metadata_dir / name
                  _, _ = download_asset(asset, temp_dir / name)
                  shutil.copyfile(temp_dir / name, dest)

              with (metadata_dir / "EXPANDED-MANIFEST.csv").open("w", newline="", encoding="utf-8") as stream:
                  writer = csv.writer(stream)
                  writer.writerow([
                      "order", "directory", "source_zip_asset", "zip_bytes", "zip_sha256",
                      "expanded_files", "expanded_bytes", "omitted_git_metadata_files", "omitted_git_metadata_bytes", "oversize_file_handling"
                  ])
                  writer.writerows([row + (("split into two parts; see EMQX-LARGE-FILE-RESTORE.md") if row[1] == SPLIT_PACKAGE else "",) for row in rows])

              run_git([
                  "add", "-f", "--",
                  "protocol-fuzzing-baselines/README.md",
                  "protocol-fuzzing-baselines/_metadata",
              ])
              run_git(["rm", "-f", "--", WORKFLOW])
              run_git(["commit", "-m", "Add protocol baseline source notes and extraction manifest"])
              if pushes:
                  time.sleep(11)
              run_git(["push", "origin", f"HEAD:refs/heads/{BRANCH}"])

          summary = (
              f"Published {len(rows)} ordered directories; {total_files:,} files; "
              f"{total_bytes:,} expanded bytes. Skipped {skipped_git_files:,} embedded .git files "
              f"({skipped_git_bytes:,} bytes). The 118.6 MB EMQX artifact is stored as two checksum-verified parts."
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"## Directory publication complete\n\n{summary}\n")
          PY
